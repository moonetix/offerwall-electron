name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Smoke test, wall in the browser
        run: xvfb-run -a npm run test:smoke -- --no-sandbox
      - name: Smoke test, wall window
        run: xvfb-run -a npm run test:smoke -- --no-sandbox --wall-window
